# 한국 IP self-hosted 러너용 파이프라인.
# 사용법: docs/self-hosted-runner.md 참고. 러너 등록 후 이 워크플로우를 활성화하고
# 기존 analyze.yml(호스티드)은 schedule을 끄거나 비활성화하세요(중복 실행 방지).
name: 경매 파이프라인 (self-hosted·한국IP)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 21 * * *"     # 매일 06:00 KST

permissions:
  contents: write

concurrency:
  group: auction-pipeline-sh
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: [self-hosted]          # ← 한국 IP 러너
    steps:
      - uses: actions/checkout@v4

      # setup-python은 self-hosted에서 불안정할 수 있어 시스템 python 사용.
      # (러너 머신에 Python 3.10+ 설치 필요)
      - name: 파이썬 확인
        run: python3 --version

      - name: 물건 수집 (법원경매정보, 한국 IP)
        run: python3 scripts/crawl.py

      - name: 분석 (시세·적정입찰·성공률·순이익·점수)
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python3 scripts/analyze.py

      - name: 예측 스냅샷·실제결과 대조·학습파일
        run: python3 scripts/track.py

      - name: 결과 커밋
        run: |
          git config user.name  "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/properties.json data/analysis.json data/predictions.json data/outcomes.json data/calibration.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 경매 파이프라인 갱신(self-hosted) [skip ci]"
            git push
          fi

# --- 대안 A(하이브리드): 크롤만 self-hosted, 분석은 호스티드 ---
# crawl job(runs-on: [self-hosted])에서 properties.json 커밋/푸시만 하고,
# 별도 워크플로우를 on.push(paths: data/properties.json) 트리거로 두어
# analyze·track을 ubuntu-latest에서 실행하면 머신 부하를 줄일 수 있습니다.
